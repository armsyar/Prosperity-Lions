<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A lion dance performance with drums">
  <defs>
    <radialGradient id="q7-bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#FFE1C4"/>
      <stop offset="100%" stop-color="#FF9E6B"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#q7-bg)"/>

  <!-- confetti burst -->
  <g fill="#FFC64A">
    <circle cx="120" cy="90" r="7"/>
    <circle cx="680" cy="80" r="6"/>
    <circle cx="720" cy="180" r="5"/>
    <circle cx="90" cy="200" r="5"/>
    <path d="M600 130 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M150 150 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z"/>
  </g>

  <!-- ground -->
  <rect y="420" width="800" height="80" fill="#B5241D"/>

  <!-- lion body / cloth -->
  <path d="M330 480 q70 -70 140 0 l0 -90 q-70 -34 -140 0 z" fill="#E63B2E"/>
  <path d="M330 480 q70 -34 140 0" stroke="#FFC64A" stroke-width="6" fill="none"/>

  <!-- big performing lion head, mid-leap pose, matching the character portrait style -->
  <g transform="translate(400 245)">
    <!-- chin beard -->
    <g fill="#B5241D">
      <circle cx="-70" cy="122" r="24"/>
      <circle cx="-24" cy="140" r="26"/>
      <circle cx="24" cy="140" r="26"/>
      <circle cx="70" cy="122" r="24"/>
    </g>
    <g fill="#FFC64A">
      <circle cx="-64" cy="118" r="10"/>
      <circle cx="-22" cy="132" r="10"/>
      <circle cx="22" cy="132" r="10"/>
      <circle cx="64" cy="118" r="10"/>
    </g>

    <!-- mane, two layers -->
    <g fill="#8C1B15">
      <circle cx="-140" cy="10" r="50"/>
      <circle cx="140" cy="10" r="50"/>
      <circle cx="-100" cy="-78" r="44"/>
      <circle cx="100" cy="-78" r="44"/>
    </g>
    <g fill="#B5241D">
      <circle cx="-118" cy="4" r="58"/>
      <circle cx="118" cy="4" r="58"/>
      <circle cx="-64" cy="-88" r="52"/>
      <circle cx="64" cy="-88" r="52"/>
      <circle cx="0" cy="-112" r="56"/>
    </g>

    <!-- ears -->
    <circle cx="-98" cy="-48" r="28" fill="#E63B2E"/>
    <circle cx="98" cy="-48" r="28" fill="#E63B2E"/>
    <circle cx="-98" cy="-48" r="13" fill="#FFC64A"/>
    <circle cx="98" cy="-48" r="13" fill="#FFC64A"/>

    <!-- face -->
    <circle cx="0" cy="14" r="132" fill="#E63B2E"/>

    <!-- gold headpiece band -->
    <path d="M-108 -52 Q0 -92 108 -52 Q104 -30 80 -28 Q0 -54 -80 -28 Q-104 -30 -108 -52 Z" fill="#FFC64A" stroke="#E8A628" stroke-width="3"/>
    <circle cx="-64" cy="-52" r="5" fill="#E8A628"/>
    <circle cx="-32" cy="-64" r="5" fill="#E8A628"/>
    <circle cx="32" cy="-64" r="5" fill="#E8A628"/>
    <circle cx="64" cy="-52" r="5" fill="#E8A628"/>

    <!-- pompom -->
    <rect x="-8" y="-140" width="16" height="32" fill="#E8A628"/>
    <circle cx="0" cy="-144" r="22" fill="#E63B2E" stroke="#B5241D" stroke-width="4"/>

    <!-- forehead mirror -->
    <circle cx="0" cy="-22" r="19" fill="#FFF7E0" stroke="#E8A628" stroke-width="4"/>
    <circle cx="0" cy="-22" r="11" fill="#FFFFFF"/>

    <!-- white eye patches -->
    <ellipse cx="-42" cy="22" rx="38" ry="32" fill="#FFF4E8"/>
    <ellipse cx="42" cy="22" rx="38" ry="32" fill="#FFF4E8"/>

    <!-- brows -->
    <path d="M-92 -6 q34 -24 68 -6" stroke="#5C1410" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M92 -6 q-34 -24 -68 -6" stroke="#5C1410" stroke-width="11" fill="none" stroke-linecap="round"/>

    <!-- big round eyes -->
    <circle cx="-42" cy="24" r="30" fill="#FFFFFF"/>
    <circle cx="42" cy="24" r="30" fill="#FFFFFF"/>
    <circle cx="-36" cy="30" r="15" fill="#3A2115"/>
    <circle cx="48" cy="30" r="15" fill="#3A2115"/>

    <!-- nose -->
    <ellipse cx="0" cy="50" rx="17" ry="11" fill="#3A2115"/>

    <!-- huge open mouth -->
    <path d="M-88 78 q88 84 176 0 q-14 72 -88 72 q-74 0 -88 -72z" fill="#5C1410"/>
    <path d="M-62 92 q62 52 124 0 q-10 38 -62 38 q-52 0 -62 -38z" fill="#FF8F7A"/>
  </g>

  <!-- drum -->
  <g transform="translate(640 380)">
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#B5241D"/>
    <rect x="-60" y="-40" width="120" height="40" fill="#E63B2E"/>
    <ellipse cx="0" cy="-40" rx="60" ry="20" fill="#FFECC8"/>
    <path d="M-60 -20 L60 -20" stroke="#5C1410" stroke-width="4"/>
  </g>
</svg>
