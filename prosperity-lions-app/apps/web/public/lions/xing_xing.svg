  <ellipse cx="242" cy="210" rx="30" ry="34" fill="#FFFFFF"/>
  <circle cx="168" cy="216" r="15" fill="#194E30"/>
  <circle cx="256" cy="216" r="16" fill="#194E30"/>
  <circle cx="173" cy="208" r="4" fill="#FFFFFF"/>
  <circle cx="261" cy="208" r="4" fill="#FFFFFF"/>

  <circle cx="132" cy="250" r="16" fill="#FF9E7A" opacity="0.5"/>
  <circle cx="268" cy="250" r="16" fill="#FF9E7A" opacity="0.5"/>

  <ellipse cx="200" cy="240" rx="16" ry="11" fill="#194E30"/>

