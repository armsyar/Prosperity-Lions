  <path d="M124 172 q30 -20 62 -2" stroke="#194E30" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M276 172 q-30 -20 -62 -2" stroke="#194E30" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- eyes: big, wide, one looking sideways (curious) -->
